services:
  bioscan-ai:
    build: .
    container_name: bioscan-ai-app
    ports:
      - "5000:5000"
    volumes:
      # Mount instance directory to persist the SQLite database
      - ./instance:/app/instance
      # Mount snapshots directory to persist cropped facial screenshots
      - ./static/snapshots:/app/static/snapshots
    restart: unless-stopped
